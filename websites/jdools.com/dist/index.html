<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jdools.com - Available Services</title>
<style>
:root {
--primary: #6366f1;
--bg-dark: #0f172a;
--glass: rgba(255, 255, 255, 0.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', -apple-system, system-ui, sans-serif;
background: var(--bg-dark);
color: white;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow-x: hidden;
}
.aurora {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
z-index: -1;
background:
radial-gradient(circle at 20% 20%, #4338ca 0%, transparent 40%),
radial-gradient(circle at 80% 80%, #9333ea 0%, transparent 40%),
radial-gradient(circle at 50% 50%, #0f172a 0%, transparent 100%);
filter: blur(100px);
animation: aurora-flow 20s ease-in-out infinite alternate;
}
@keyframes aurora-flow {
0% { transform: scale(1) translate(0, 0); }
100% { transform: scale(1.1) translate(20px, 20px); }
}
.card {
background: var(--glass);
backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.1);
padding: 3rem;
border-radius: 2rem;
text-align: center;
max-width: 600px;
width: 90%;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}
h1 { font-size: 3rem; font-weight: 900; background: linear-gradient(to bottom right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.2; margin-bottom: 2rem; }
.service-list {
display: flex;
flex-direction: column;
gap: 1rem;
text-align: left;
}
.service-item {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.1);
padding: 1.5rem;
border-radius: 1rem;
text-decoration: none;
color: white;
transition: transform 0.2s, background 0.2s, border-color 0.2s;
display: flex;
justify-content: space-between;
align-items: center;
}
.service-item:hover {
transform: translateY(-4px);
background: rgba(255, 255, 255, 0.08);
border-color: var(--primary);
}
.service-name { font-size: 1.25rem; font-weight: 700; }
.service-url { font-size: 0.9rem; color: #94a3b8; font-family: monospace; }
.arrow { font-size: 1.5rem; color: var(--primary); }
.footer { margin-top: 2.5rem; color: #64748b; font-size: 0.875rem; }

/* Contact row */
.contact {
margin-top: 2rem;
display: flex;
justify-content: center;
gap: 1.5rem;
}
.contact a {
color: #64748b;
text-decoration: none;
transition: color 0.2s, transform 0.2s;
display: inline-flex;
align-items: center;
justify-content: center;
width: 36px;
height: 36px;
border-radius: 50%;
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.contact a:hover {
color: white;
background: rgba(255, 255, 255, 0.1);
border-color: var(--primary);
transform: translateY(-2px);
}
.contact svg {
width: 18px;
height: 18px;
fill: currentColor;
}
</style>
</head>
